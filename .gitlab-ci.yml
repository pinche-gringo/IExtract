stages:
  - test

.something: &prepare_repo
  - export PKG_CONFIG_PATH=$PKG_CONFIG_PATH:/usr/local/lib/pkgconfig/
  - meson setup build

code_check:
  stage: test
  before_script:
    *prepare_repo
  script:
    ninja -C build check_code
  only:
    - master

test:
  stage: test
  before_script:
    - *prepare_repo
    - meson compile -C build
  script:
    - meson test -C build --print-errorlogs
