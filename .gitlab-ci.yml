stages:
  - test

test:
  before_script:
    - aclocal -I m4 && libtoolize
    - automake -a && autoheader && autoconf
    - export PKG_CONFIG_PATH=$PKG_CONFIG_PATH:/usr/local/lib/pkgconfig/
    - ./configure
    - mgeni.pl src/Options.h>src/Options.meta
    - make -j6
  script:
    - python -m unittest test/test.py
